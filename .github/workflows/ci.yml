name: Indent CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Test & Lint ──────────────────────────────────────────────
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: indent-native

      - name: Run tests
        working-directory: indent-native
        run: cargo test --verbose

      - name: Check formatting (advisory)
        working-directory: indent-native
        run: cargo fmt --check || echo "::warning::main.rs is not rustfmt-clean (non-blocking)"

      - name: Lint (advisory)
        working-directory: indent-native
        run: cargo clippy

  # ── Build Release Binaries ───────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: indent-native

      - name: Build release
        working-directory: indent-native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd indent-native/target/${{ matrix.target }}/release
          tar -czf indent-${{ github.ref_name }}-${{ matrix.target }}.tar.gz indent
          echo "ASSET=indent-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd indent-native/target/${{ matrix.target }}/release
          7z a indent-${{ github.ref_name }}-${{ matrix.target }}.zip indent.exe
          echo "ASSET=indent-${{ github.ref_name }}-${{ matrix.target }}.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indent-${{ matrix.target }}
          path: indent-native/target/${{ matrix.target }}/release/${{ env.ASSET }}

  # ── Publishing ──────────────────────────────────────────────
  #
  # This workflow deliberately does NOT create GitHub Releases. It used to, and
  # because it only ever packaged the bare `indent` binary it raced against
  # release.yml and often won — publishing tarballs with no `std/` and no `air`.
  # Release Indent (.github/workflows/release.yml) owns publishing: it stages
  # std/, air and the installer scripts, and it builds the system packages.
  #
  # The `build` job above stays as a plain compile/upload check on PRs.
