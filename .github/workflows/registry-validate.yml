name: Validate Registry

on:
  pull_request:
    paths:
      - 'index.txt'
      - 'packages/index.txt'
      - 'packages/**/*.ind'
      - 'scripts/validate-registry.sh'
      - '.github/workflows/registry-validate.yml'
  workflow_dispatch:

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry index
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate-registry.sh
          scripts/validate-registry.sh

  check-package-syntax:
    runs-on: ubuntu-latest
    needs: validate-index
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build indent runtime
        working-directory: indent-native
        run: cargo build --release

      - name: Check package syntax
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate-registry.sh

          INDEX_PATH="index.txt"
          if [[ ! -f "$INDEX_PATH" && -f "packages/index.txt" ]]; then
            INDEX_PATH="packages/index.txt"
          fi

          mapfile -t pkg_paths < <(scripts/validate-registry.sh "$INDEX_PATH" --list-local-sources)

          if [[ ${#pkg_paths[@]} -eq 0 ]]; then
            echo "No local package sources to syntax-check"
            exit 0
          fi

          for pkg in "${pkg_paths[@]}"; do
            echo "Checking $pkg"
            ./indent-native/target/release/indent check "$pkg"
          done
