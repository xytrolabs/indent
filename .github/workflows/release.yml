name: Release Indent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime unit tests
        working-directory: indent-native
        run: cargo test --release

      - name: Installer safety checks
        run: scripts/ci/verify-installer-safety.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: indent
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: indent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: indent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: indent-native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact dir
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/indent-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "indent-native/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGE_DIR/"
          cp -r std "$STAGE_DIR/std"
          cp air "$STAGE_DIR/air" 2>/dev/null || true
          cp indentpkg "$STAGE_DIR/indentpkg" 2>/dev/null || true
          cp air.ps1 "$STAGE_DIR/air.ps1" 2>/dev/null || true
          cp indentpkg.ps1 "$STAGE_DIR/indentpkg.ps1" 2>/dev/null || true
          cp scripts/install.sh "$STAGE_DIR/install.sh" 2>/dev/null || true
          cp scripts/install.ps1 "$STAGE_DIR/install.ps1" 2>/dev/null || true
          cp README.md "$STAGE_DIR/README.md"
          cp LICENSE "$STAGE_DIR/LICENSE" 2>/dev/null || true

      - name: Package Linux system packages (.deb/.rpm)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/indent-${VERSION}-${{ matrix.target }}"
          bash scripts/package-linux-system-packages.sh "$VERSION" "${{ matrix.target }}" "$STAGE_DIR" dist

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="indent-${VERSION}-${{ matrix.target }}"
          tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $name = "indent-$version-${{ matrix.target }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: indent-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

  smoke-artifacts:
    name: Smoke Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: indent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="indent-${VERSION}-${{ matrix.target }}"
          ARCHIVE="$(find release-artifacts -type f -name "${NAME}.tar.gz" -print -quit)"
          if [[ -z "${ARCHIVE}" ]]; then
            echo "Artifact not found for ${NAME}" >&2
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$TMP_DIR"
          STAGE_DIR="$TMP_DIR/$NAME"

          test -x "$STAGE_DIR/${{ matrix.bin_name }}"
          "$STAGE_DIR/${{ matrix.bin_name }}" --version
          "$STAGE_DIR/${{ matrix.bin_name }}" check tests/smoke.ind
          "$STAGE_DIR/${{ matrix.bin_name }}" test tests
          "$STAGE_DIR/${{ matrix.bin_name }}" examples/demo.ind
          "$STAGE_DIR/air" index
          "$STAGE_DIR/indentpkg" index

          VERSION_CLEAN="${VERSION#v}"
          DEB_ARCH="amd64"
          RPM_ARCH="x86_64"
          DEB_ASSET="$(find release-artifacts -type f -name "indent_${VERSION_CLEAN}_${DEB_ARCH}.deb" -print -quit)"
          RPM_ASSET="$(find release-artifacts -type f -name "indent-${VERSION_CLEAN}-1*.${RPM_ARCH}.rpm" -print -quit)"

          if [[ -z "${DEB_ASSET}" ]]; then
            echo "Missing .deb artifact for ${VERSION_CLEAN}/${DEB_ARCH}" >&2
            exit 1
          fi

          if [[ -z "${RPM_ASSET}" ]]; then
            echo "Missing .rpm artifact for ${VERSION_CLEAN}/${RPM_ARCH}" >&2
            exit 1
          fi

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $name = "indent-$version-${{ matrix.target }}"
          $archive = Get-ChildItem -Path release-artifacts -Recurse -Filter "$name.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "Artifact not found for $name"
          }

          $tmp = Join-Path $env:TEMP "indent-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Expand-Archive -Path $archive.FullName -DestinationPath $tmp -Force
          $stage = Join-Path $tmp $name
          $exe = Join-Path $stage "${{ matrix.bin_name }}"

          if (-not (Test-Path $exe)) {
            throw "Missing executable: $exe"
          }

          & $exe --version
          & $exe check tests/smoke.ind
          & $exe test tests
          & $exe examples/demo.ind

          $airPs1 = Join-Path $stage "air.ps1"
          $pkgPs1 = Join-Path $stage "indentpkg.ps1"
          if (Test-Path $airPs1) {
            & powershell -ExecutionPolicy Bypass -File $airPs1 index
          }
          if (Test-Path $pkgPs1) {
            & powershell -ExecutionPolicy Bypass -File $pkgPs1 index
          }

  smoke-linux-packages:
    name: Smoke Test Linux Packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Install package smoke test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Smoke test .deb install (APT)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          DEB_ASSET="$(find release-artifacts -type f -name "indent_${VERSION_CLEAN}_amd64.deb" -print -quit)"

          if [[ -z "${DEB_ASSET}" ]]; then
            echo "Missing .deb artifact for ${VERSION_CLEAN}/amd64" >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y "$DEB_ASSET"

          command -v indent
          command -v air
          command -v indentpkg

          indent --version
          indent check tests/smoke.ind
          indent test tests
          air index
          indentpkg index

          sudo apt-get remove -y indent

      - name: Smoke test .rpm install (DNF in Fedora container)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          RPM_ASSET="$(find release-artifacts -type f -name "indent-${VERSION_CLEAN}-1*.x86_64.rpm" -print -quit)"

          if [[ -z "${RPM_ASSET}" ]]; then
            echo "Missing .rpm artifact for ${VERSION_CLEAN}/x86_64" >&2
            exit 1
          fi

          RPM_TMP_DIR="$(mktemp -d)"
          cp "$RPM_ASSET" "$RPM_TMP_DIR/indent.rpm"

          docker run --rm \
            -v "$RPM_TMP_DIR:/pkg:ro" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            fedora:40 \
            bash -lc '
              set -euo pipefail
              dnf -y install /pkg/indent.rpm
              cd /repo
              command -v indent
              command -v air
              command -v indentpkg
              indent --version
              indent check tests/smoke.ind
              indent test tests
              air index
              indentpkg index
            '

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, smoke-artifacts, smoke-linux-packages]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          
          # Get SHA256 for the macOS ARM tarball
          MACOS_ARM_SHA=$(sha256sum dist/indent-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz 2>/dev/null | cut -d' ' -f1 || echo "UPDATE_ME")
          MACOS_X64_SHA=$(sha256sum dist/indent-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz 2>/dev/null | cut -d' ' -f1 || echo "UPDATE_ME")
          LINUX_X64_SHA=$(sha256sum dist/indent-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz 2>/dev/null | cut -d' ' -f1 || echo "UPDATE_ME")
          
          # Generate an updated Homebrew formula
          cat > dist/indent.rb << BREWEOF
class Indent < Formula
  desc "Simple, readable, beginner-friendly programming language"
  homepage "https://github.com/${{ github.repository }}"
  version "${VERSION_CLEAN}"
  license "MIT"

  on_macos do
    on_arm do
      url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/indent-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
      sha256 "${MACOS_ARM_SHA}"
    end
    on_intel do
      url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/indent-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
      sha256 "${MACOS_X64_SHA}"
    end
  end

  on_linux do
    on_arm do
      url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/indent-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz"
      sha256 "${LINUX_X64_SHA}"
    end
    on_intel do
      url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/indent-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
      sha256 "${MACOS_X64_SHA}"
    end
  end

  def install
    (libexec/"bin").install "indent"
    libexec.install "std"
    libexec.install "packages" if Dir.exist?("packages")
    (bin/"indent").write_env_script libexec/"bin/indent",
      INDENT_PATH: "\#{libexec}"
  end

  test do
    assert_match "indent #{version}", shell_output("\#{bin}/indent --version")
  end
end
BREWEOF
          echo "✅ Homebrew formula generated at dist/indent.rb"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
