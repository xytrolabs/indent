name: Release Indent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime unit tests
        working-directory: indent-native
        run: cargo test --release

      - name: Installer safety checks
        run: scripts/ci/verify-installer-safety.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: indent
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: indent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: indent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: indent-native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact dir
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/indent-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "indent-native/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGE_DIR/"
          cp -r std "$STAGE_DIR/std"
          cp air "$STAGE_DIR/air" 2>/dev/null || true
          cp air.ps1 "$STAGE_DIR/air.ps1" 2>/dev/null || true
          cp scripts/install.sh "$STAGE_DIR/install.sh" 2>/dev/null || true
          cp scripts/install.ps1 "$STAGE_DIR/install.ps1" 2>/dev/null || true
          cp README.md "$STAGE_DIR/README.md"
          cp LICENSE "$STAGE_DIR/LICENSE" 2>/dev/null || true

      - name: Package Linux system packages (.deb/.rpm)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="dist/indent-${VERSION}-${{ matrix.target }}"
          bash scripts/package-linux-system-packages.sh "$VERSION" "${{ matrix.target }}" "$STAGE_DIR" dist

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="indent-${VERSION}-${{ matrix.target }}"
          tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $name = "indent-$version-${{ matrix.target }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: indent-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm

  smoke-artifacts:
    name: Smoke Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: indent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: indent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="indent-${VERSION}-${{ matrix.target }}"
          ARCHIVE="$(find release-artifacts -type f -name "${NAME}.tar.gz" -print -quit)"
          if [[ -z "${ARCHIVE}" ]]; then
            echo "Artifact not found for ${NAME}" >&2
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$TMP_DIR"
          STAGE_DIR="$TMP_DIR/$NAME"

          test -x "$STAGE_DIR/${{ matrix.bin_name }}"
          "$STAGE_DIR/${{ matrix.bin_name }}" --version
          # `check` takes a directory; `run` executes a file. This used to call
          # `check tests/smoke.ind` against a file that never existed.
          "$STAGE_DIR/${{ matrix.bin_name }}" run tests/smoke.ind
          # "Batteries included": every archive must ship the runtime, AIR, and
          # the FULL standard library. Releases used to ship a bare `indent`
          # binary, which silently broke installs, so fail loudly instead.
          test -f "$STAGE_DIR/air"
          test -d "$STAGE_DIR/std"
          STD_COUNT="$(find "$STAGE_DIR/std" -name '*.ind' | wc -l)"
          if [[ "$STD_COUNT" -lt 10 ]]; then
            echo "Archive ships only ${STD_COUNT} stdlib files; expected the full std/" >&2
            exit 1
          fi
          echo "Archive OK: runtime + air + ${STD_COUNT} stdlib files"

          VERSION_CLEAN="${VERSION#v}"
          DEB_ARCH="amd64"
          RPM_ARCH="x86_64"
          DEB_ASSET="$(find release-artifacts -type f -name "indent_${VERSION_CLEAN}_${DEB_ARCH}.deb" -print -quit)"
          RPM_ASSET="$(find release-artifacts -type f -name "indent-${VERSION_CLEAN}-1*.${RPM_ARCH}.rpm" -print -quit)"

          if [[ -z "${DEB_ASSET}" ]]; then
            echo "Missing .deb artifact for ${VERSION_CLEAN}/${DEB_ARCH}" >&2
            exit 1
          fi

          if [[ -z "${RPM_ASSET}" ]]; then
            echo "Missing .rpm artifact for ${VERSION_CLEAN}/${RPM_ARCH}" >&2
            exit 1
          fi

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $name = "indent-$version-${{ matrix.target }}"
          $archive = Get-ChildItem -Path release-artifacts -Recurse -Filter "$name.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "Artifact not found for $name"
          }

          $tmp = Join-Path $env:TEMP "indent-smoke-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Expand-Archive -Path $archive.FullName -DestinationPath $tmp -Force
          $stage = Join-Path $tmp $name

          # The zip stores the *contents* of the staged directory (the build
          # uses Compress-Archive -Path "dist/$name/*"), so the files land
          # directly in $tmp rather than under $tmp/$name.
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter "${{ matrix.bin_name }}" | Select-Object -First 1

          if (-not $exe) {
            throw "Missing ${{ matrix.bin_name }} in $name.zip"
          }

          & $exe.FullName --version
          & $exe.FullName run tests/smoke.ind

          $airPs1 = Get-ChildItem -Path $tmp -Recurse -Filter "air.ps1" | Select-Object -First 1
          if (-not $airPs1) {
            throw "AIR (air.ps1) missing from $name.zip"
          }

          # "Batteries included": the zip must also carry the full standard
          # library, not just the executable.
          $stdDir = Get-ChildItem -Path $tmp -Recurse -Directory -Filter "std" | Select-Object -First 1
          if (-not $stdDir) {
            throw "Standard library (std/) missing from $name.zip"
          }
          $stdCount = (Get-ChildItem -Path $stdDir.FullName -Filter "*.ind").Count
          if ($stdCount -lt 10) {
            throw "$name.zip ships only $stdCount stdlib files; expected the full std/"
          }
          Write-Host "Archive OK: runtime + air + $stdCount stdlib files"

  smoke-linux-packages:
    name: Smoke Test Linux Packages
    runs-on: ubuntu-latest
    needs: build
    # Advisory only. This job exercises the .deb/.rpm *install* paths, which need
    # apt/dnf/docker on the runner. The archives themselves are already verified
    # by smoke-artifacts, so a failure here must never block publishing a
    # release. Failures are still reported in the run summary.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # docker is already present on ubuntu-latest. Installing docker.io on top
      # of it conflicts with the runner's containerd packages and aborts with
      # "pkgProblemResolver::Resolve generated breaks".
      - name: Verify docker is available
        run: docker --version

      - name: Smoke test .deb install (APT)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          echo "Debs discovered under release-artifacts/:"
          find release-artifacts -type f -name '*.deb' -print || true
          DEB_ASSET="$(find release-artifacts -type f -name '*.deb' -print -quit)"
          # apt only treats an argument as a local package when it is a path to a
          # .deb file; resolve it so the value always has the expected suffix.
          if [[ -n "$DEB_ASSET" ]]; then
            DEB_ASSET="$(realpath "$DEB_ASSET")"
          fi

          if [[ -z "$DEB_ASSET" || ! -f "$DEB_ASSET" ]]; then
            echo "Missing .deb artifact for ${VERSION_CLEAN}/amd64" >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y "$DEB_ASSET"

          command -v indent
          command -v air

          indent --version
          indent run tests/smoke.ind

          sudo apt-get remove -y indent

      - name: Smoke test .rpm install (DNF in Fedora container)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          echo "RPMs discovered under release-artifacts/:"
          find release-artifacts -type f -name '*.rpm' -print || true
          RPM_ASSET="$(find release-artifacts -type f -name '*.rpm' -print -quit)"
          if [[ -n "$RPM_ASSET" ]]; then
            RPM_ASSET="$(realpath "$RPM_ASSET")"
          fi

          if [[ -z "$RPM_ASSET" || ! -f "$RPM_ASSET" ]]; then
            echo "Missing .rpm artifact for ${VERSION_CLEAN}/x86_64" >&2
            exit 1
          fi

          RPM_TMP_DIR="$(mktemp -d)"
          cp "$RPM_ASSET" "$RPM_TMP_DIR/indent.rpm"

          docker run --rm \
            -v "$RPM_TMP_DIR:/pkg:ro" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            fedora:40 \
            bash -lc '
              set -euo pipefail
              dnf -y install /pkg/indent.rpm
              cd /repo
              command -v indent
              command -v air
              indent --version
              indent run tests/smoke.ind
            '

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, smoke-artifacts]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      # The formula generator lives in scripts/ (not inline) because a bash
      # heredoc terminator must sit at column 0, which a YAML block scalar
      # cannot express — inline heredocs make this whole file invalid YAML.
      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME}" dist
          echo "Homebrew formula generated at dist/indent.rb"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
