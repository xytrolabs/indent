name: Build VS Code Extensions

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Indent Language extension
        working-directory: indent-language
        run: vsce package --allow-missing-repository

      - name: Package Indent File Icons extension
        working-directory: indent-file-icons
        run: vsce package --allow-missing-repository

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indent-vsix
          path: |
            indent-language/*.vsix
            indent-file-icons/*.vsix

      # NOTE: `secrets` cannot be referenced in an `if:` expression — GitHub
      # rejects the entire workflow file as invalid ("This run likely failed
      # because of a workflow file issue"). Pass the token through env and
      # decide inside the step instead.
      - name: Publish Indent Language to Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: indent-language
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT not configured; skipping Marketplace publish."
            exit 0
          fi
          vsce publish -p "$VSCE_PAT"

      - name: Publish Indent File Icons to Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: indent-file-icons
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT not configured; skipping Marketplace publish."
            exit 0
          fi
          vsce publish -p "$VSCE_PAT"
