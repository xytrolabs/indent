name: Build VS Code Extensions

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package Indent Language extension
        working-directory: indent-language
        run: vsce package --allow-missing-repository

      - name: Package Indent File Icons extension
        working-directory: indent-file-icons
        run: vsce package --allow-missing-repository

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indent-vsix
          path: |
            indent-language/*.vsix
            indent-file-icons/*.vsix

      - name: Publish Indent Language to Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && secrets.VSCE_PAT != ''
        working-directory: indent-language
        run: vsce publish -p "${{ secrets.VSCE_PAT }}"

      - name: Publish Indent File Icons to Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && secrets.VSCE_PAT != ''
        working-directory: indent-file-icons
        run: vsce publish -p "${{ secrets.VSCE_PAT }}"
