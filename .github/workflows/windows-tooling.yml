name: Validate Windows Tooling

on:
  push:
    paths:
      - 'air.ps1'
      - 'indentpkg.ps1'
      - '.github/workflows/windows-tooling.yml'
      - '.github/workflows/release.yml'
      - 'packages/index.txt'
  pull_request:
    paths:
      - 'air.ps1'
      - 'indentpkg.ps1'
      - '.github/workflows/windows-tooling.yml'
      - '.github/workflows/release.yml'
      - 'packages/index.txt'
  workflow_dispatch:

jobs:
  windows-powershell-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate indentpkg.ps1 help and index
        shell: pwsh
        run: |
          ./indentpkg.ps1 index

      - name: Validate air.ps1 help
        shell: pwsh
        run: |
          ./air.ps1 --help

      - name: Validate AIR registry command parsing
        shell: pwsh
        run: |
          ./air.ps1 registry github xytrolabs/indent main packages/index.txt
          ./air.ps1 registry show
