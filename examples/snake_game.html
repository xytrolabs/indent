<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indent Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
  }
  h1 { color: #58a6ff; margin-bottom: 8px; font-size: 28px; letter-spacing: 1px; }
  .hud {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 16px;
  }
  .hud span { color: #f0883e; font-weight: bold; }
  canvas {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .controls { margin-top: 10px; font-size: 13px; color: #8b949e; text-align: center; }
  .controls kbd {
    background: #21262d; border: 1px solid #30363d; border-radius: 4px;
    padding: 2px 6px; font-size: 12px;
  }
  #ai { margin-top: 8px; color: #7ee787; font-size: 13px; font-style: italic; max-width: 460px; text-align: center; }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    background: rgba(13,17,23,0.85); flex-direction: column;
  }
  .overlay h2 { color: #f85149; font-size: 34px; margin-bottom: 12px; }
  .overlay p { color: #c9d1d9; font-size: 16px; margin-bottom: 20px; }
  .overlay button {
    background: #238636; color: #fff; border: none; border-radius: 6px;
    padding: 12px 28px; font-size: 16px; cursor: pointer;
  }
  .overlay button:hover { background: #2ea043; }
</style>
</head>
<body>
  <h1>🐍 Indent Snake</h1>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="high">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <p id="ai" class="controls"></p>
  <div class="controls">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> pause
  </div>
  <div class="overlay" id="overlay">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button id="restart">Play Again</button>
  </div>

<script>
// ===== Indent Snake — playable inside the WebKitGTK window =====
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var GRID = 20;           // 20x20 grid
var CELL = canvas.width / GRID;

var snake, dir, nextDir, food, score, high, running, paused, gameLoop;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  running = true;
  paused = false;
  placeFood();
  document.getElementById('overlay').style.display = 'none';
  updateHud();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('high').textContent = high;
}

function step() {
  if (!running || paused) return;
  dir = nextDir;
  var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > high) high = score;
    updateHud();
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  document.getElementById('finalScore').textContent = 'Final score: ' + score;
  document.getElementById('overlay').style.display = 'flex';
}

function draw() {
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#1f2630';
  ctx.lineWidth = 0.5;
  for (var i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#f85149';
  ctx.shadowColor = '#f85149'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  for (var i = 0; i < snake.length; i++) {
    var s = snake[i];
    ctx.fillStyle = (i === 0) ? '#39d353' : '#26a641';
    if (i === 0) { ctx.shadowColor = '#39d353'; ctx.shadowBlur = 8; }
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    ctx.shadowBlur = 0;
  }
}

function tick() {
  step();
  draw();
}

// Keyboard
document.addEventListener('keydown', function(e) {
  var k = e.key;
  if (k === 'ArrowUp' && dir.y !== 1) nextDir = {x: 0, y: -1};
  else if (k === 'ArrowDown' && dir.y !== -1) nextDir = {x: 0, y: 1};
  else if (k === 'ArrowLeft' && dir.x !== 1) nextDir = {x: -1, y: 0};
  else if (k === 'ArrowRight' && dir.x !== -1) nextDir = {x: 1, y: 0};
  else if (k === ' ') paused = !paused;
});

document.getElementById('restart').addEventListener('click', reset);

high = 0;
reset();
gameLoop = setInterval(tick, 90);
</script>
</body>
</html>
