[package]
name = "indent"
version = "2.5.0"
edition = "2024"

# Release profile tuned for a tree-walking interpreter: the evaluator is one hot
# loop spread across many functions, so cross-crate inlining matters a lot.
# `lto = "fat"` + `codegen-units = 1` let the optimizer inline the evaluator and
# the std-library helpers into each other; `panic = "abort"` drops the unwinding
# tables (the runtime never catches panics, so there is nothing to unwind for).
# Build time goes up noticeably — use `cargo build` for day-to-day work.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
# Used for the on-disk AST cache (`__incache__/*.inc`): the parsed program is
# serialised with bincode so a re-run can skip lexing and parsing entirely.
serde = { version = "1", features = ["derive"] }
bincode = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
sha2 = "0.10"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
toml = "0.8"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
