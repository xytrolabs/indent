[package]
name = "indent-lsp"
version = "1.0.0"
edition = "2021"
description = "Language Server Protocol server for Indent — powered by Tower-LSP and indent-core"

[dependencies]
indent-core = { path = "../indent-core" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
log = "0.4"
env_logger = "0.10"
